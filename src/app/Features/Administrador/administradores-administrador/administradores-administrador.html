<section class="admin__view">
    <header class="view__header">
        <h2 class="header__title">Administradores</h2>
        <button class="header__button">
            <svg width="20" height="20" aria-hidden="true">
                <use href="/image/sprite.svg#add"></use>
            </svg>
            Registrar</button>
    </header>

    <section class="view__cards">
        <ul class="cards__list">
            <li class="list__item">
                <small class="item__title">Totales</small>
                <strong class="item__content">{{adminTotales()}}</strong>
            </li>
        </ul>
    </section>

    <table class="view__table">
        <thead class="table__title">
            <tr class="title__row">
                <th class="row__title">Nombres</th>
                <th class="row__title">Apellidos</th>
                <th class="row__title">Correo</th>
                <th class="row__title">Teléfono</th>
                <th class="row__title">Acciones</th>
            </tr>
        </thead>
        <tbody class="table__body">
            @for (admin of admins(); track admin.numeroDocumento) {
                <tr class="body__row">
                    <td class="row__content">{{admin.nombres}}</td>
                    <td class="row__content">{{admin.apellidos}}</td>
                    <td class="row__content">{{admin.correo}}</td>
                    <td class="row__content">{{admin.telefono}}</td>
                    <td class="row__content">Hola</td>
                </tr>
            }
        </tbody>
    </table>
</section>
